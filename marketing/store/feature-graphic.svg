<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" font-family="Inter, -apple-system, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1F"/>
      <stop offset="0.6" stop-color="#0E1424"/>
      <stop offset="1" stop-color="#1a2238"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#0056D2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0056D2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#5B8DEF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5B8DEF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E5F4F"/>
      <stop offset="1" stop-color="#12876E"/>
    </linearGradient>
    <linearGradient id="pp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2A4A"/>
      <stop offset="1" stop-color="#0F1730"/>
    </linearGradient>
    <linearGradient id="id" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#C2CBF1"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6C77E"/>
      <stop offset="0.5" stop-color="#B8923C"/>
      <stop offset="1" stop-color="#E6C77E"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#0056D2"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#grid)"/>
  <rect width="1024" height="500" fill="url(#glow)"/>
  <rect width="1024" height="500" fill="url(#glow2)"/>

  <!-- Left side: logo + headline -->
  <g transform="translate(60,140)">
    <!-- Logo mark -->
    <g transform="translate(0,0)">
      <rect width="68" height="68" rx="16" fill="#0F1730" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <g transform="translate(34,34) scale(0.6) translate(-54,-54)">
        <path fill="#FFFFFF" fill-rule="evenodd"
              d="M54,26 L78,32 C80,32 81,33 81,35 L81,58 C81,72 70,82 54,88 C38,82 27,72 27,58 L27,35 C27,33 28,32 30,32 Z
                 M54,34 L72,38.5 C73,38.5 73.5,39 73.5,40 L73.5,58 C73.5,69 65,77.5 54,82 C43,77.5 34.5,69 34.5,58 L34.5,40 C34.5,39 35,38.5 36,38.5 Z"/>
        <path fill="#FFFFFF" d="M44,50 L54,57 L64,50 L64,56 L54,63 L44,56 Z"/>
        <path fill="#FFFFFF" d="M44,60 L54,67 L64,60 L64,66 L54,73 L44,66 Z"/>
      </g>
    </g>
    <text x="86" y="44" font-size="34" font-weight="800" fill="#E6EAF5" letter-spacing="-1">Kryptos</text>

    <text x="0" y="130" font-size="48" font-weight="800" fill="#E6EAF5" letter-spacing="-1.5">Your private vault.</text>
    <text x="0" y="180" font-size="48" font-weight="800" fill="url(#grad)" letter-spacing="-1.5">Locked by design.</text>

    <text x="0" y="225" font-size="18" font-weight="500" fill="#9AA3BA">Zero-knowledge · AES-256 · NFC &amp; OCR · Biometric</text>
  </g>

  <!-- Right side: card stack -->
  <g transform="translate(610,80)">
    <!-- Bank card (back) -->
    <g transform="translate(40,180) rotate(-8)">
      <rect width="320" height="200" rx="20" fill="url(#cc)" opacity="0.95"/>
      <rect x="20" y="20" width="80" height="22" rx="5" fill="rgba(0,0,0,0.18)"/>
      <text x="32" y="36" font-size="11" font-weight="700" fill="white" letter-spacing="1.5">DEBIT</text>
      <rect x="20" y="60" width="48" height="36" rx="6" fill="url(#chip)"/>
      <text x="20" y="140" font-size="20" font-family="JetBrains Mono, monospace" fill="white" letter-spacing="2">•••• 4827</text>
      <text x="20" y="170" font-size="12" fill="rgba(255,255,255,0.85)" letter-spacing="1">VISA · 09/29</text>
    </g>

    <!-- ID card (middle) -->
    <g transform="translate(20,90) rotate(2)">
      <rect width="320" height="200" rx="20" fill="url(#id)"/>
      <rect x="20" y="20" width="120" height="22" rx="5" fill="rgba(0,0,0,0.08)"/>
      <text x="32" y="36" font-size="11" font-weight="700" fill="#1B1B1F" letter-spacing="1.5">DRIVER'S LICENSE</text>
      <text x="20" y="120" font-size="22" font-weight="800" fill="#1B1B1F" letter-spacing="1">FAIZAL ZAIN</text>
      <text x="20" y="148" font-size="13" fill="rgba(0,0,0,0.6)">Class B · Exp 2028</text>
    </g>

    <!-- Passport card (top) -->
    <g transform="translate(0,0) rotate(-3)">
      <rect width="320" height="200" rx="20" fill="url(#pp)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <rect x="20" y="20" width="85" height="22" rx="5" fill="rgba(255,255,255,0.12)"/>
      <text x="32" y="36" font-size="11" font-weight="700" fill="white" letter-spacing="1.5">PASSPORT</text>
      <text x="280" y="36" font-size="18">🇲🇾</text>
      <text x="20" y="120" font-size="22" font-weight="800" fill="#EEF2FF" letter-spacing="1">FAIZAL ZAIN</text>
      <text x="20" y="148" font-size="13" fill="rgba(238,242,255,0.7)">A12345678 · Exp 2031</text>

      <!-- NFC indicator -->
      <g transform="translate(265,135)">
        <circle cx="0" cy="0" r="20" fill="rgba(91,141,239,0.18)" stroke="rgba(91,141,239,0.5)" stroke-width="1"/>
        <path d="M-9,0 a9,9 0 0 1 18,0 M-5,4 a5,5 0 0 1 10,0" fill="none" stroke="#5B8DEF" stroke-width="2" stroke-linecap="round"/>
        <circle cx="0" cy="6" r="1.5" fill="#5B8DEF"/>
      </g>
    </g>
  </g>
</svg>
