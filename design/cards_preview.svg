    <text x="24" y="316" fill="#1A1404" font-family="monospace" font-size="20" font-weight="700">A12345678</text>
    <rect y="334" width="520" height="46" fill="#EDE4C8"/>
    <text x="24" y="356" fill="#1A1404" font-family="monospace" font-size="13">P&lt;MYSZAIN&lt;&lt;FAIZAL&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;</text>
    <text x="24" y="374" fill="#1A1404" font-family="monospace" font-size="13">A12345678&lt;MYS9004124M3104123&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;</text>
  </g>

