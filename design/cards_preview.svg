    <text x="340" y="266" fill="#FFFFFFB3" font-size="12" letter-spacing="2">EXPIRES</text>
    <text x="340" y="288" fill="#FFFFFF" font-family="monospace" font-size="18" font-weight="600">12 / 28</text>
    <text x="450" y="266" fill="#FFFFFFB3" font-size="12" letter-spacing="2">CVV</text>
