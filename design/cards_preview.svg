    <text x="40" y="158" fill="#8FA8FF" font-family="monospace" font-size="16">export API_SECRET=</text>
    <text x="250" y="158" fill="#E5EEFF" font-family="monospace" font-size="16">sk_live_4Hb7Yc••••••••••••</text>
