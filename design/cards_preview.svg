  <g transform="translate(60,820)">
    <rect width="1080" height="220" rx="32" fill="#0B1020"/>
    <circle cx="40" cy="44" r="6" fill="#FF5F57"/>
    <circle cx="60" cy="44" r="6" fill="#FEBC2E"/>
    <circle cx="80" cy="44" r="6" fill="#28C840"/>
    <text x="1050" y="48" fill="#8FA8FF" font-family="monospace" font-size="14" text-anchor="end">OpenAI · production</text>
    <text x="40" y="110" fill="#8FA8FF" font-family="monospace" font-size="16">export API_KEY=</text>
