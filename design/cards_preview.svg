<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="-apple-system, system-ui, sans-serif">
  <defs>
    <linearGradient id="cc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1730"/>
      <stop offset="0.5" stop-color="#2E3A66"/>
      <stop offset="1" stop-color="#1A2238"/>
    </linearGradient>
    <linearGradient id="id" x1="0" y1="0" x2="1" y2="1">
