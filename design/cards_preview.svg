    <text x="84" y="194" fill="#1A223888" font-size="36" text-anchor="middle">👤</text>
    <text x="174" y="130" fill="#1A223888" font-size="11" letter-spacing="2">FULL NAME</text>
    <text x="174" y="154" fill="#0E152B" font-size="20" font-weight="700">Faizal Zain</text>
    <text x="174" y="186" fill="#1A223888" font-size="11" letter-spacing="2">DATE OF BIRTH</text>
